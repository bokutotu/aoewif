spec-version: 0.36.0

name: aoewif
version: 0.1.0
synopsis: Tensor IR scheduling and C/CUDA source generation
description: |
  A base-only tensor compute IR with CPU and CUDA scheduling,
  validation, and deterministic C and CUDA source generation.
category: Compilers
license: NONE
github: bokutotu/aoewif

dependencies:
  - base >= 4.22 && < 4.23

language: GHC2024
ghc-options:
  - -Wall

library:
  source-dirs: src

tests:
  aoewif-test:
    main: Spec.hs
    source-dirs: tests
    dependencies:
      - aoewif
      - hspec
