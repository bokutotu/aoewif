spec-version: 0.36.0

name: aoewif
version: 0.1.0
category: Compilers
license: NONE
github: bokutotu/aoewif

dependencies:
  - base >= 4.22 && < 4.23

language: GHC2024
ghc-options:
  - -Wall
  - -Werror

library:
  source-dirs: src
  exposed-modules:
    - Aoewif.Target.Cuda.Sm80
    - Aoewif.Target.Cuda.Sm80.DSL
    - Aoewif.Target.Cuda.Sm80.Instruction
    - Aoewif.Target.Cuda.Sm80.Render
    - Aoewif.Target.Cuda.Sm90
    - Aoewif.Target.Cuda.Sm90.DSL
    - Aoewif.Target.Cuda.Sm90.Instruction
    - Aoewif.Target.Cuda.Sm90.Render
    - Aoewif.Target.Cuda.Codegen
    - Aoewif.Target.Cuda.DSL
    - Aoewif.Target.Cuda.Syntax
    - Aoewif.Target.Cuda.TensorCoreOp
  other-modules:
    - Aoewif.Target.Cuda.Sm90.Asm
    - Aoewif.Target.Cuda.Sm90.Cluster.Instruction
    - Aoewif.Target.Cuda.Sm90.Cluster.Render
    - Aoewif.Target.Cuda.Sm90.MBarrier.Instruction
    - Aoewif.Target.Cuda.Sm90.MBarrier.Render
    - Aoewif.Target.Cuda.Sm90.Tma.Instruction
    - Aoewif.Target.Cuda.Sm90.Tma.Render
    - Aoewif.Target.Cuda.Sm90.Wgmma.Instruction
    - Aoewif.Target.Cuda.Sm90.Wgmma.Render

tests:
  aoewif-test:
    main: Spec.hs
    source-dirs: tests
    default-extensions:
      - MultilineStrings
    dependencies:
      - aoewif
      - hspec
    build-tools:
      - hspec-discover
