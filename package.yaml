spec-version: 0.36.0

name: aoewif
version: 0.1.0
synopsis: Tensor IR scheduling and C/CUDA source generation
description: |
  A typed tensor compute eDSL with scoped CPU and CUDA scheduling
  and deterministic C and CUDA source generation.
category: Compilers
license: NONE
github: bokutotu/aoewif

dependencies:
  - base >= 4.22 && < 4.23

language: GHC2024
ghc-options:
  - -Wall

library:
  source-dirs: src
  exposed-modules:
    - Aoewif.Codegen
    - Aoewif.Compute
    - Aoewif.IR
    - Aoewif.Schedule
  other-modules:
    - Aoewif.Internal.Codegen.Base
    - Aoewif.Internal.Codegen.Cpu
    - Aoewif.Internal.Codegen.Cuda
    - Aoewif.Internal.Compute
    - Aoewif.Internal.Compute.Operation
    - Aoewif.Internal.IR
    - Aoewif.Internal.Kernel.Lower
    - Aoewif.Internal.Kernel.Operation
    - Aoewif.Internal.Schedule.Builder

tests:
  aoewif-test:
    main: Spec.hs
    source-dirs: tests
    dependencies:
      - aoewif
      - hspec
