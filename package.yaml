spec-version: 0.36.0

name: aoewif
version: 0.1.0
category: Compilers
license: NONE
github: bokutotu/aoewif

dependencies:
  - base >= 4.22 && < 4.23

language: GHC2024
ghc-options:
  - -Wall
  - -Werror

library:
  source-dirs: src
  exposed-modules:
    - Aoewif.Target.Cuda.Alignment
    - Aoewif.Target.Cuda.Codegen
    - Aoewif.Target.Cuda.DSL
    - Aoewif.Target.Cuda.Expr
    - Aoewif.Target.Cuda.Kernel
    - Aoewif.Target.Cuda.Name
    - Aoewif.Target.Cuda.Parameter
    - Aoewif.Target.Cuda.Render
    - Aoewif.Target.Cuda.Stmt
    - Aoewif.Target.Cuda.Type

tests:
  aoewif-test:
    main: Spec.hs
    source-dirs: tests
    default-extensions:
      - MultilineStrings
    dependencies:
      - aoewif
      - hspec
    build-tools:
      - hspec-discover
